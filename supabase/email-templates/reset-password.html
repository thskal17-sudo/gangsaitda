<!--
  강사잇다 · 비밀번호 재설정 메일 문구
  Supabase → Authentication → Emails → "Reset password" (Reset Password) 칸에 붙여넣습니다.
  - Subject(제목) 칸에는: [강사잇다] 비밀번호를 다시 정해 주세요
  - Body(본문) 칸에는: 이 파일에서 아래 <div ...> 부터 끝까지 (이 설명 부분은 빼도 되고 같이 넣어도 됩니다)
  링크는 사이트의 새 비밀번호 화면(/account/new-password)으로 바로 갑니다.
  {{ .SiteURL }} 은 Supabase → Authentication → URL Configuration 의 Site URL (https://www.gangsaitda.com) 로 바뀝니다.
-->
<div style="max-width:480px;margin:0 auto;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#191F28;word-break:keep-all">
  <p style="margin:0 0 24px;font-size:20px;font-weight:800;color:#1800AD">강사<span style="color:#FF3131">잇</span>다</p>
  <h1 style="margin:0 0 12px;font-size:22px;font-weight:700">비밀번호를 다시 정해 주세요</h1>
  <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6B7684">
    강사잇다에서 비밀번호 재설정을 요청하셨어요.<br>
    아래 버튼을 누르고 새 비밀번호를 입력하면 바로 바뀝니다.
  </p>
  <a href="{{ .SiteURL }}/account/new-password?token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;padding:16px 28px;border-radius:14px;background:#2F6BF0;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none">
    새 비밀번호 정하기
  </a>
  <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6B7684">
    이 링크는 <b>1시간 동안, 한 번만</b> 쓸 수 있어요.<br>
    요청하지 않으셨다면 이 메일은 무시하셔도 됩니다. 비밀번호는 바뀌지 않아요.
  </p>
  <hr style="margin:32px 0 16px;border:none;border-top:1px solid #E5E8EB">
  <p style="margin:0;font-size:12px;color:#8B95A1">이 메일은 보내기 전용이라 답장을 받을 수 없어요. 문의: thskal17@gmail.com</p>
</div>
